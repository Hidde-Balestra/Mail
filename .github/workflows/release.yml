name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Release-sleutel klaarzetten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 ontbreekt; zonder vaste sleutel kunnen updates niet installeren."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Handtekening controleren
        # Breekt de build af als de APK niet met de vaste release-sleutel is ondertekend.
        env:
          EXPECTED_SHA256: 48a94856fc96c654e05bf380e648f71915271f0aa5acb4579839809af0c6882a
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          CERTS=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$CERTS" | grep -E "DN|SHA-256"
          echo "$CERTS" | grep -q "SHA-256 digest: $EXPECTED_SHA256" || {
            echo "::error::APK is niet ondertekend met de vaste release-sleutel"; exit 1; }

      - name: Rename APK
        run: |
          NAME="${GITHUB_REF_NAME}"
          [[ "$NAME" == v* ]] || NAME="build-${GITHUB_RUN_NUMBER}"
          mv build/app/outputs/flutter-apk/app-release.apk "Mail-${NAME}.apk"
          echo "APK=Mail-${NAME}.apk" >> "$GITHUB_ENV"
          echo "TAG=${NAME}" >> "$GITHUB_ENV"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Mail ${{ env.TAG }}
          files: ${{ env.APK }}
          generate_release_notes: true
