name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          NAME="${GITHUB_REF_NAME}"
          [[ "$NAME" == v* ]] || NAME="build-${GITHUB_RUN_NUMBER}"
          mv build/app/outputs/flutter-apk/app-release.apk "Mail-${NAME}.apk"
          echo "APK=Mail-${NAME}.apk" >> "$GITHUB_ENV"
          echo "TAG=${NAME}" >> "$GITHUB_ENV"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Mail ${{ env.TAG }}
          files: ${{ env.APK }}
          generate_release_notes: true
